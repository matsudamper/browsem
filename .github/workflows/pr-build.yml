name: PR Android Build

on:
  pull_request:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Decode debug keystore
        shell: bash
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleDebug

      - name: Rename APK with branch and short hash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          # リポジトリ名のみ取得（org名を除去）し、ブランチ名のスラッシュをハイフンに置換してファイル名に使えるようにする
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          APK_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload debug APK
        id: upload_apk
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-debug-apk
          path: ${{ env.APK_PATH }}

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html
          archive: false

      - name: Generate QR code for APK download URL
        run: |
          pip install "qrcode[pil]" --quiet
          ARTIFACT_URL="${{ steps.upload_apk.outputs.artifact-url }}"
          # APKダウンロードURLを埋め込んだ QRコード PNG を生成
          python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode.png')" "$ARTIFACT_URL"

      - name: Upload QR code (未圧縮アーティファクト)
        id: upload_qr
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: apk-qr-code
          path: qrcode.png
          archive: false

      - name: Publish QR code to ci-artifacts branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ci-artifacts ブランチが存在しない場合は空のオーファンブランチを作成する
          if ! gh api "/repos/${{ github.repository }}/branches/ci-artifacts" > /dev/null 2>&1; then
            EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            COMMIT_SHA=$(gh api \
              -X POST "/repos/${{ github.repository }}/git/commits" \
              -f message="ci: initialize ci-artifacts branch" \
              -f "tree=${EMPTY_TREE}" \
              --jq '.sha')
            gh api \
              -X POST "/repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/ci-artifacts" \
              -f sha="${COMMIT_SHA}"
          fi

          # PR番号をファイル名に使い、同一PRの再ビルド時は上書きする
          QR_FILENAME="pr-${{ github.event.pull_request.number }}-qrcode.png"
          QR_BASE64=$(base64 -w0 qrcode.png)

          # 既存ファイルの SHA を取得（上書き時に必要）
          EXISTING_SHA=$(gh api \
            "/repos/${{ github.repository }}/contents/qr-codes/${QR_FILENAME}?ref=ci-artifacts" \
            --jq '.sha' 2>/dev/null || true)

          if [ -n "$EXISTING_SHA" ]; then
            gh api \
              -X PUT "/repos/${{ github.repository }}/contents/qr-codes/${QR_FILENAME}" \
              -f message="ci: update QR code for PR #${{ github.event.pull_request.number }}" \
              -f content="${QR_BASE64}" \
              -f branch="ci-artifacts" \
              -f sha="${EXISTING_SHA}" \
              --silent
          else
            gh api \
              -X PUT "/repos/${{ github.repository }}/contents/qr-codes/${QR_FILENAME}" \
              -f message="ci: add QR code for PR #${{ github.event.pull_request.number }}" \
              -f content="${QR_BASE64}" \
              -f branch="ci-artifacts" \
              --silent
          fi

          echo "QR_IMAGE_URL=https://raw.githubusercontent.com/${{ github.repository }}/ci-artifacts/qr-codes/${QR_FILENAME}" >> "$GITHUB_ENV"

      - name: Comment APK download URL
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: apk-download
          message: |
            ✅ Debug APK artifact is ready.

            - Download URL: ${{ steps.upload_apk.outputs.artifact-url }}
            - Artifact Name: `${{ env.APK_NAME }}`

            ### QR Code
            ![QR Code](${{ env.QR_IMAGE_URL }})

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Instrumentation Tests (Managed Device)
        run: ./gradlew :app:pixel6Api34DebugAndroidTest

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: app-androidtest-report
          path: |
            app/build/reports/androidTests/managedDevice/debug/pixel6Api34
            app/build/outputs/androidTest-results/managedDevice/debug/pixel6Api34
