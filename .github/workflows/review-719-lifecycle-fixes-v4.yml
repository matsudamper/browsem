name: PR 719 Translation Connection Regression Fix

on:
  push:
    branches:
      - chatgpt/review-719-helper

permissions:
  contents: write

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/review-719-helper
          path: helper

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/improve-html-ai-translation
          fetch-depth: 0
          path: target

      - name: Verify target HEAD
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "0b44e1dc10ed6db69c4e7292a698dc1fffc576d1"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Apply connection regression fix
        working-directory: target
        run: python3 ../helper/.github/scripts/review_719_lifecycle_fixes.py

      - name: Check JavaScript syntax
        working-directory: target
        run: node --check app/src/main/assets/web_extensions/page_translation_bridge/content.js

      - name: Assemble debug
        working-directory: target
        run: ./gradlew :app:assembleDebug

      - name: Run detekt
        working-directory: target
        run: ./gradlew detekt

      - name: Run tests
        working-directory: target
        run: ./gradlew test

      - name: Run ktlint
        working-directory: target
        run: ./gradlew ktlintCheck

      - name: Commit and push connection regression fix
        working-directory: target
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "matsudamper"
          git config user.email "matsudamper971227@gmail.com"
          git add app/src/main/assets/web_extensions/page_translation_bridge/content.js
          git commit -m "表示中ページの翻訳接続回帰を修正" -m "MessageDelegate の先行登録へ切り替えた際、有限 handshake の復帰手段だったページ側トリガーだけを削除していたため、リトライ上限到達後は翻訳開始時にも Native Messaging が再接続されなかった。非表示ページでは停止し、表示中ページだけ1秒間隔で handshake を継続して scanPage が確実にポートへ到達できるようにする。"
          git push origin HEAD:chatgpt/improve-html-ai-translation
