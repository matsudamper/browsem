name: Temporary file picker patch

on:
  push:
    branches:
      - change-file-picker-open-document

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: change-file-picker-open-document
      - name: Apply file picker change
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/net/matsudamper/browser/GeckoBrowserTab.kt")
          content = path.read_text()

          replacements = [
              ("GetContentWithMimeTypes", "OpenDocumentWithMimeTypes"),
              ("GetMultipleContentsWithMimeTypes", "OpenMultipleDocumentsWithMimeTypes"),
              ("ACTION_GET_CONTENT", "ACTION_OPEN_DOCUMENT"),
              (
                  "Google Photos を含むピッカーを表示するため ACTION_OPEN_DOCUMENT を使用",
                  "クラウドストレージを含む統合ピッカーを表示するため ACTION_OPEN_DOCUMENT を使用",
              ),
              (
                  "OpenDocument と異なり Google Photos などのフォトアプリもピッカーに表示される。",
                  "DocumentsProvider を通じてローカルとクラウドストレージを統合表示する。",
              ),
              (
                  "OpenMultipleDocuments と異なり Google Photos などのフォトアプリもピッカーに表示される。",
                  "DocumentsProvider を通じてローカルとクラウドストレージを統合表示する。",
              ),
          ]
          for old, new in replacements:
              if old not in content:
                  raise RuntimeError(f"置換対象が見つかりません: {old}")
              content = content.replace(old, new)

          path.write_text(content)
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/net/matsudamper/browser/GeckoBrowserTab.kt
          git commit -m "ファイルピッカーをクラウド統合表示に変更する" -m "ACTION_GET_CONTENT から ACTION_OPEN_DOCUMENT に切り替え、DocumentsProvider 経由でローカルとクラウドストレージを同じシステムピッカーに表示する。複数選択時の intent.data / clipData マージ処理は維持する。"
          git push origin HEAD:change-file-picker-open-document
