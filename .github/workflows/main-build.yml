name: Main Android Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Decode debug keystore
        shell: bash
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"

      - name: Build release APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 9

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html
          archive: false

  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: テスト前のシステムリソース確認
        run: |
          echo "=== メモリ ==="
          free -h
          echo "=== ディスク空き容量 ==="
          df -h
          echo "=== CPU 数 ==="
          nproc
          echo "=== KVM デバイス ==="
          ls -la /dev/kvm 2>/dev/null || echo "KVM デバイスが存在しません"

      - name: Run Android Instrumentation Tests (Managed Device)
        run: ./gradlew :app:pixel6Api34DebugAndroidTest

      - name: テスト失敗時の診断情報収集
        if: failure()
        run: |
          echo "=== テスト失敗時のメモリ ==="
          free -h
          echo "=== テスト失敗時のディスク ==="
          df -h
          echo "=== Gradle Managed Device ログファイル一覧 ==="
          find app/build -name "*.log" 2>/dev/null | head -30 || true
          find ~/.android -name "*.log" 2>/dev/null | head -30 || true
          echo "=== adb デバイス一覧 ==="
          adb devices 2>/dev/null || true
          echo "=== ビルド出力ディレクトリ構造 ==="
          find app/build/outputs -type f 2>/dev/null | head -50 || true

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-androidtest-report
          path: |
            app/build/reports/androidTests/managedDevice/debug/pixel6Api34
            app/build/outputs/androidTest-results/managedDevice/debug/pixel6Api34

      - name: テスト失敗時の追加ログアップロード
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-failure-logs
          path: |
            app/build/outputs/managed_device_android_test_additional_output/
            app/build/reports/androidTests/
          retention-days: 7

  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Run detekt
        run: ./gradlew detekt
