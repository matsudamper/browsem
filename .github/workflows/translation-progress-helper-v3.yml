name: Translation Progress Helper v3

on:
  push:
    branches:
      - chatgpt/translation-progress-helper

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/improve-html-ai-translation
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Apply translation progress UI
        shell: bash
        run: |
          git show origin/chatgpt/translation-progress-helper:.github/scripts/apply-translation-progress.py > /tmp/apply-translation-progress.py
          python3 /tmp/apply-translation-progress.py

      - name: Assemble debug
        run: ./gradlew --console=plain --no-daemon :app:assembleDebug

      - name: Run detekt
        run: ./gradlew --console=plain --no-daemon detekt

      - name: Run tests
        run: ./gradlew --console=plain --no-daemon test

      - name: Record Paparazzi preview
        run: ./gradlew --console=plain --no-daemon :app:recordPaparazziDebug -Dpaparazzi.filter=PreviewTranslationStatusBarPreparingModel

      - name: Collect Paparazzi image
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/translation-status-paparazzi"
          find app/src/test/snapshots/images -type f -name '*.png' -mmin -10 -exec cp {} "${RUNNER_TEMP}/translation-status-paparazzi/" \;
          test -n "$(find "${RUNNER_TEMP}/translation-status-paparazzi" -type f -name '*.png' -print -quit)"

      - name: Commit target branch changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add \
            app/src/main/kotlin/net/matsudamper/browser/translate/Translator.kt \
            app/src/main/kotlin/net/matsudamper/browser/TranslationStatusBar.kt \
            app/src/main/kotlin/net/matsudamper/browser/PageTranslator.kt \
            app/src/main/kotlin/net/matsudamper/browser/translate/LocalAITranslator.kt \
            app/src/main/kotlin/net/matsudamper/browser/BrowserTabScreenState.kt \
            app/src/test/kotlin/net/matsudamper/browser/TranslationProgressStateTest.kt
          git commit -m "翻訳バーにローカルAIの準備状況を表示"
          git push origin HEAD:refs/heads/chatgpt/improve-html-ai-translation

      - name: Upload Paparazzi image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translation-status-paparazzi
          path: ${{ runner.temp }}/translation-status-paparazzi/*.png
