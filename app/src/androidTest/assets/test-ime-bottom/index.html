<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IME Bottom Input Test</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: sans-serif;
      }
      /*
        入力欄をビューポート下端付近に置くための余白。
        表示領域が縮んだときに入力欄が一緒に上へ動いてしまうと、
        スクロールが行われなくてもテストが通ってしまう。
        それを防ぐため、文書全体をビューポートより十分長くして
        リフローで入力欄が上がらないようにする。
      */
      .spacer-above {
        height: 90vh;
      }
      .spacer-below {
        height: 200vh;
      }
      #bottom-input {
        box-sizing: border-box;
        width: 100%;
        height: 8vh;
        font-size: 24px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="spacer-above">
      <h1>IME Bottom Input</h1>
    </div>
    <input type="text" id="bottom-input" name="bottom" placeholder="bottom-input" />
    <div class="spacer-below"></div>
  </body>
</html>
