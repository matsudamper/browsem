<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IME Bottom Input Test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #000000;
        font-family: sans-serif;
      }
      /* 入力欄をビューポート最下部に置くためのスペーサー */
      .spacer {
        flex: 1;
      }
      #bottom-input {
        box-sizing: border-box;
        width: 100%;
        height: 12vh;
        font-size: 24px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="spacer">
      <h1>IME Bottom Input</h1>
    </div>
    <input type="text" id="bottom-input" name="bottom" placeholder="bottom-input" />
  </body>
</html>
