<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IME Bottom Input Test</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: sans-serif;
      }
      /*
        vh などビューポート相対の値を使うと、表示領域が縮んだときに入力欄が
        リフローで一緒に上へ動いてしまい、スクロールが行われなくてもテストが
        通ってしまう。そのため寸法はすべて固定の CSS ピクセルで指定する。

        値は GMD の Pixel 6 (API 34, CSS ピクセルで約 390x840) を前提に、
        キーボード非表示では入力欄が見えており、キーボード (300dp) を出すと
        隠れる位置になるよう調整してある。
      */
      .spacer-above {
        height: 600px;
      }
      /* 文書をビューポートより十分長くしてスクロール余地を残す。 */
      .spacer-below {
        height: 2000px;
      }
      #bottom-input {
        box-sizing: border-box;
        width: 100%;
        height: 60px;
        font-size: 24px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="spacer-above">
      <h1>IME Bottom Input</h1>
    </div>
    <input type="text" id="bottom-input" name="bottom" placeholder="bottom-input" />
    <div class="spacer-below"></div>
  </body>
</html>
