<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IME Bottom Input Test</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: sans-serif;
      }
      /*
        入力欄は文書の末尾に置く。下に余白があるとスクロールの余地が残り、
        表示領域が縮まなくても Gecko が入力欄を上へ運べてしまうため、
        Issue #674 の「下までスクロールしても入力欄がキーボードに隠れたまま」
        という状態にならない。

        vh などビューポート相対の値は使わない。表示領域が縮んだときに
        入力欄がリフローで動いてしまうため、寸法は固定の CSS ピクセルにする。
      */
      .spacer-above {
        height: 2000px;
      }
      #bottom-input {
        box-sizing: border-box;
        width: 100%;
        height: 60px;
        font-size: 24px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="spacer-above">
      <h1>IME Bottom Input</h1>
    </div>
    <input type="text" id="bottom-input" name="bottom" placeholder="bottom-input" />
  </body>
</html>
