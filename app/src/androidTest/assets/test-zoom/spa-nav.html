<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPA Zoom Test</title>
</head>
<body>
  <button id="nav-btn">SPA Navigate</button>
  <script>
    function reportViewportWidth() {
      const width = window.innerWidth;
      const route = window.location.hash.includes("route2") ? "route2" : "home";
      history.replaceState(null, "", "#" + route + "/w=" + width);
    }
    window.addEventListener("load", reportViewportWidth);
    window.addEventListener("resize", reportViewportWidth);
    setInterval(reportViewportWidth, 500);
    document.getElementById("nav-btn").addEventListener("click", function () {
      // SPA 遷移時に viewport をデフォルトへ戻す（実サイトでよくあるパターン）
      const meta = document.querySelector('meta[name="viewport"]');
      if (meta) meta.content = "width=device-width,initial-scale=1";
      history.pushState(null, "", "#route2");
      setTimeout(reportViewportWidth, 50);
    });
  </script>
</body>
</html>
