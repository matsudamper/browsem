<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard Bottom Input</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 220vh;
        font-family: sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .spacer {
        height: 180vh;
        padding: 24px;
      }
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px;
        background: #f5f5f5;
        border-top: 1px solid #cccccc;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
      }
      #bottom-input {
        width: 100%;
        font-size: 20px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="spacer">
      <h1>Keyboard bottom input fixture</h1>
      <p>ページ下部の固定入力欄にフォーカスしたとき、キーボード上に見えること。</p>
    </div>
    <footer>
      <label for="bottom-input">Bottom field</label>
      <input id="bottom-input" type="text" placeholder="Type here" autocomplete="off" />
    </footer>
  </body>
</html>
