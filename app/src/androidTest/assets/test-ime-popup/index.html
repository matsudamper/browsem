<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IME Popup Test</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: sans-serif;
      }
      /* キーボードを出すための入力欄と、その下に開くポップアップを画面内に置く。 */
      #text-input,
      #choice {
        box-sizing: border-box;
        width: 100%;
        height: 60px;
        font-size: 24px;
        padding: 8px;
      }
      /* 文書を長くしてスクロール可能にする。補正が走る余地を作るため。 */
      .spacer-below {
        height: 2000px;
      }
    </style>
  </head>
  <body>
    <h1>IME Popup</h1>
    <input type="text" id="text-input" name="text" placeholder="text-input" />
    <select id="choice" name="choice">
      <option value="alpha">alpha</option>
      <option value="bravo">bravo</option>
      <option value="charlie">charlie</option>
    </select>
    <div class="spacer-below"></div>
  </body>
</html>
